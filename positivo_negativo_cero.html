<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Positivo, negativo o cero?</title>
<style>
  :root{
    --bg:#f6f8fc; --card:#ffffff; --text:#172033; --muted:#667085;
    --border:#e6eaf0; --green:#22a06b; --red:#e05252; --gray:#7a8496;
    --blue:#536dfe; --shadow:0 18px 50px rgba(31,41,55,.10);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
    background:linear-gradient(145deg,#f8fbff,#f3f5fb); color:var(--text);
    display:flex; justify-content:center; padding:24px;
  }
  .app{width:min(760px,100%); margin:auto}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .brand{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
  .score{background:#fff;border:1px solid var(--border);padding:9px 13px;border-radius:999px;font-weight:800;font-size:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow);padding:30px}
  .topline{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:14px;font-weight:700}
  .progress{height:8px;background:#edf0f5;border-radius:99px;margin:14px 0 30px;overflow:hidden}
  .progress-bar{height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .35s ease}
  .icon{font-size:42px;margin-bottom:12px}
  h1{font-size:clamp(28px,5vw,42px);line-height:1.05;margin:0 0 14px;letter-spacing:-.03em}
  .instruction{color:var(--muted);margin:0 0 24px;font-size:16px}
  .situation{
    background:#f8f9fc;border:1px solid #edf0f5;border-radius:20px;padding:24px;
    font-size:clamp(20px,4vw,28px);font-weight:750;line-height:1.35;margin-bottom:22px;
  }
  .answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  button{
    border:0;cursor:pointer;font:inherit;transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
  }
  .answer{
    min-height:88px;border:2px solid var(--border);background:#fff;border-radius:18px;padding:15px 10px;
    font-weight:850;font-size:17px;color:var(--text);
  }
  .answer:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 9px 20px rgba(31,41,55,.08)}
  .answer .dot{display:block;font-size:25px;margin-bottom:5px}
  .answer.positive:hover:not(:disabled),.answer.positive.selected{border-color:var(--green);background:#eefaf4}
  .answer.negative:hover:not(:disabled),.answer.negative.selected{border-color:var(--red);background:#fff1f1}
  .answer.zero:hover:not(:disabled),.answer.zero.selected{border-color:var(--gray);background:#f2f4f7}
  .feedback{display:none;margin-top:20px;border-radius:18px;padding:18px 20px;line-height:1.5}
  .feedback.show{display:block;animation:pop .25s ease}
  .feedback.correct{background:#eefaf4;border:1px solid #b9e6cf}
  .feedback.incorrect{background:#fff2f2;border:1px solid #f0c2c2}
  .feedback-title{font-weight:900;margin-bottom:5px}
  .next{
    display:none;margin:18px 0 0 auto;background:var(--blue);color:#fff;border-radius:14px;padding:13px 20px;font-weight:850;
  }
  .next.show{display:block}
  .next:hover{filter:brightness(.96);transform:translateY(-1px)}
  .results{text-align:center;display:none;padding:20px 0 4px}
  .results.show{display:block;animation:pop .3s ease}
  .result-emoji{font-size:58px}
  .results h2{font-size:34px;margin:10px 0}
  .result-score{font-size:22px;font-weight:850;margin:8px 0 10px}
  .result-message{color:var(--muted);margin-bottom:24px}
  .restart{background:var(--blue);color:#fff;border-radius:14px;padding:14px 24px;font-weight:850}
  .tip{margin-top:15px;text-align:center;color:var(--muted);font-size:12px}
  @keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
  @media(max-width:560px){
    body{padding:12px}.card{padding:21px;border-radius:22px}
    .answers{grid-template-columns:1fr}.answer{min-height:70px}
    .answer .dot{display:inline;margin-right:7px}
    .situation{padding:19px}
  }
</style>
</head>
<body>
<main class="app">
  <div class="header">
    <div class="brand">Matemáticas · Números con signo</div>
    <div class="score" id="score">⭐ 0 aciertos</div>
  </div>

  <section class="card">
    <div id="quiz">
      <div class="topline">
        <span id="questionNumber">Pregunta 1 de 12</span>
        <span id="percent">0%</span>
      </div>
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

      <div class="icon">🧠</div>
      <h1>¿Positivo, negativo o cero?</h1>
      <p class="instruction">Observa la situación y selecciona cómo representarías el cambio.</p>

      <div class="situation" id="situation"></div>

      <div class="answers">
        <button class="answer positive" data-answer="positive"><span class="dot">🟢</span>Positivo</button>
        <button class="answer negative" data-answer="negative"><span class="dot">🔴</span>Negativo</button>
        <button class="answer zero" data-answer="zero"><span class="dot">⚪</span>Cero</button>
      </div>

      <div class="feedback" id="feedback">
        <div class="feedback-title" id="feedbackTitle"></div>
        <div id="feedbackText"></div>
      </div>
      <button class="next" id="next">Siguiente →</button>
    </div>

    <div class="results" id="results">
      <div class="result-emoji" id="resultEmoji">🎉</div>
      <h2>¡Actividad terminada!</h2>
      <div class="result-score" id="finalScore"></div>
      <div class="result-message" id="resultMessage"></div>
      <button class="restart" id="restart">🔄 Intentar de nuevo</button>
    </div>
  </section>

  <div class="tip">💡 No necesitas escribir nada: solo observa, piensa y elige.</div>
</main>

<script>
const questions = [
  {s:"La temperatura bajó 7 °C.", a:"negative", e:"Bajar significa disminuir. El cambio se representa con −7, por eso es negativo."},
  {s:"Un elevador subió 4 pisos.", a:"positive", e:"Subir significa aumentar la posición. El cambio se representa con +4, por eso es positivo."},
  {s:"Durante una hora, la temperatura permaneció igual.", a:"zero", e:"No hubo cambio. Cuando una cantidad permanece igual, el cambio se representa con 0."},
  {s:"Una cuenta bancaria recibió un depósito de $500.", a:"positive", e:"El dinero de la cuenta aumentó. Un aumento se representa con un número positivo: +500."},
  {s:"Un submarino descendió 20 metros.", a:"negative", e:"Descender significa bajar. El cambio en la posición es negativo: −20 metros."},
  {s:"Una persona retiró $150 de su cuenta.", a:"negative", e:"El saldo disminuyó porque se retiró dinero. Una disminución se representa con un número negativo."},
  {s:"Un jugador avanzó 6 metros hacia adelante.", a:"positive", e:"Avanzar representa un aumento de posición respecto al punto de referencia. Por eso el cambio es positivo."},
  {s:"Un automóvil no se movió durante un minuto.", a:"zero", e:"La posición no cambió. Si no hay cambio, lo representamos con 0."},
  {s:"La temperatura pasó de 10 °C a 15 °C.", a:"positive", e:"La temperatura aumentó 5 °C. Un aumento se representa con un cambio positivo: +5 °C."},
  {s:"La temperatura pasó de 8 °C a 3 °C.", a:"negative", e:"La temperatura disminuyó 5 °C. Un descenso se representa con un cambio negativo: −5 °C."},
  {s:"Un ascensor estaba en el piso 3 y terminó en el piso 3.", a:"zero", e:"Terminó en la misma posición en la que comenzó. No hubo cambio: 0 pisos."},
  {s:"Una empresa tuvo una pérdida de $800.", a:"negative", e:"Una pérdida representa una disminución del dinero. Por eso se representa con un número negativo: −800."}
];

let index=0, score=0, answered=false;

const situation=document.getElementById("situation");
const questionNumber=document.getElementById("questionNumber");
const percent=document.getElementById("percent");
const progressBar=document.getElementById("progressBar");
const scoreEl=document.getElementById("score");
const feedback=document.getElementById("feedback");
const feedbackTitle=document.getElementById("feedbackTitle");
const feedbackText=document.getElementById("feedbackText");
const next=document.getElementById("next");
const quiz=document.getElementById("quiz");
const results=document.getElementById("results");

function render(){
  const q=questions[index];
  situation.textContent=q.s;
  questionNumber.textContent=`Pregunta ${index+1} de ${questions.length}`;
  const pct=Math.round((index/questions.length)*100);
  percent.textContent=`${pct}%`;
  progressBar.style.width=`${pct}%`;
  feedback.className="feedback";
  next.className="next";
  answered=false;
  document.querySelectorAll(".answer").forEach(b=>{
    b.disabled=false; b.classList.remove("selected");
  });
}

function answer(choice){
  if(answered) return;
  answered=true;
  const q=questions[index];
  const correct=choice===q.a;
  if(correct) score++;
  scoreEl.textContent=`⭐ ${score} ${score===1?"acierto":"aciertos"}`;

  document.querySelectorAll(".answer").forEach(b=>b.disabled=true);
  const selected=document.querySelector(`[data-answer="${choice}"]`);
  selected.classList.add("selected");

  feedback.className=`feedback show ${correct?"correct":"incorrect"}`;
  feedbackTitle.textContent=correct?"✅ ¡Correcto!":"❌ Aún no.";
  feedbackText.textContent=(correct?"":"La respuesta correcta es "+label(q.a)+". ")+q.e;
  next.className="next show";
  next.textContent=index===questions.length-1?"Ver resultado →":"Siguiente →";
  progressBar.style.width=`${Math.round(((index+1)/questions.length)*100)}%`;
}

function label(a){
  return a==="positive"?"🟢 Positivo":a==="negative"?"🔴 Negativo":"⚪ Cero";
}

function finish(){
  quiz.style.display="none";
  results.classList.add("show");
  const pct=Math.round(score/questions.length*100);
  document.getElementById("finalScore").textContent=`${score} de ${questions.length} correctas · ${pct}%`;
  let msg,emoji;
  if(pct===100){emoji="🏆";msg="¡Excelente! Identificas muy bien los cambios positivos, negativos y nulos."}
  else if(pct>=75){emoji="🌟";msg="¡Muy bien! Solo necesitas revisar algunos casos."}
  else if(pct>=50){emoji="💪";msg="Buen comienzo. Observa con atención si la situación aumenta, disminuye o permanece igual."}
  else {emoji="🧩";msg="Sigue practicando. Recuerda: aumentar → positivo, disminuir → negativo, sin cambio → cero."}
  document.getElementById("resultEmoji").textContent=emoji;
  document.getElementById("resultMessage").textContent=msg;
}

document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>answer(b.dataset.answer)));
next.addEventListener("click",()=>{ if(!answered)return; if(index<questions.length-1){index++;render()}else finish();});
document.getElementById("restart").addEventListener("click",()=>{index=0;score=0;scoreEl.textContent="⭐ 0 aciertos";results.classList.remove("show");quiz.style.display="block";render();});
render();
</script>
</body>
</html>
